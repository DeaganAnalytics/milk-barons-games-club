<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Milk Baron's Games Club — V1.3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header>
      <h1>MILK BARON'S GAMES CLUB</h1>
      <p>Explore the club and meet the Milk Baron.</p>
    </header>
    <section class="viewport">
      <canvas id="game" width="1380" height="1370" aria-label="Milk Baron's club"></canvas>
    </section>
    <section class="panel" aria-live="polite">
      <h2 id="heading">The club</h2>
      <p id="info">Explore the hall and listen for the Milk Baron’s remarks.</p>
      <p class="hint">WASD / arrows to move · E / Space to interact</p>
    </section>
    <section id="conversation" class="conversation" aria-labelledby="conversation-title" hidden>
      <div class="viewport conversation-portraits" aria-hidden="true">
        <figure><div id="conversation-player" class="conversation-portrait"></div><figcaption>You</figcaption></figure>
        <figure><div id="conversation-npc" class="conversation-portrait"></div><figcaption id="conversation-speaker"></figcaption></figure>
      </div>
      <div class="panel">
        <h2 id="conversation-title"></h2>
        <p id="conversation-line" aria-live="polite"></p>
        <div id="conversation-replies" class="conversation-replies"></div>
        <button id="conversation-close" type="button">End conversation</button>
      </div>
    </section>
    <section class="panel controls">
      <div class="dpad">
        <button class="up" data-dir="up" aria-label="Move up">▲</button>
        <button class="left" data-dir="left" aria-label="Move left">◀</button>
        <button class="down" data-dir="down" aria-label="Move down">▼</button>
        <button class="right" data-dir="right" aria-label="Move right">▶</button>
      </div>
      <div class="actions">
        <button id="interact">Interact</button>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
