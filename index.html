<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Milk Baron's Games Club — v75</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header>
      <h1>MILK BARON'S GAMES CLUB <span class="game-version">v75</span></h1>
    </header>
    <section class="viewport">
      <div class="game-hud" role="group" aria-label="Game status">
        <div class="health-meter" role="status" aria-label="Health">
          <img id="health-display" src="./assets/health/6.webp" width="512" height="224" alt="3 of 3 hearts">
        </div>
        <div id="karma-meter" class="karma-meter" role="meter" aria-label="Karma" aria-valuemin="-10" aria-valuemax="10" aria-valuenow="0" aria-valuetext="Neutral">
          <img src="./assets/hall/karma-meter.webp" alt="">
          <span class="karma-marker" aria-hidden="true"></span>
        </div>
        <div id="coin-counter" class="coin-counter" hidden role="status" aria-label="Coin balance">
          <span aria-hidden="true">×<span id="coin-count">100</span></span>
          <span id="coin-announcement" class="visually-hidden">100 coins</span>
        </div>
      </div>
      <canvas id="game" width="1380" height="1370" aria-label="Milk Baron's club"></canvas>
      <div id="game-over" class="game-over" role="alert" hidden>
        <h2 id="end-title">Game Over</h2>
        <p id="end-message">You have displeased the Baron!</p>
        <button id="restart-game" type="button">Restart</button>
      </div>
    </section>
    <section class="panel status-panel" aria-live="polite">
      <p id="info">Explore the hall and listen for the Milk Baron’s remarks.</p>
      <p class="hint">WASD / arrows to move · E / Space to interact</p>
    </section>
    <section id="conversation" class="conversation" aria-labelledby="conversation-title" hidden>
      <div class="viewport conversation-portraits" aria-hidden="true">
        <figure><div id="conversation-player" class="conversation-portrait"><canvas width="512" height="512"></canvas></div><figcaption>You</figcaption></figure>
        <figure><div id="conversation-npc" class="conversation-portrait"></div><figcaption id="conversation-speaker"></figcaption></figure>
      </div>
      <div class="panel">
        <div class="conversation-heading">
          <h2 id="conversation-title"></h2>
          <div id="pokie-coin-counter" class="coin-counter" role="status" aria-label="Milk token balance" hidden>
            <span>×<span id="pokie-coin-count">100</span></span>
          </div>
        </div>
        <p id="conversation-line" aria-live="polite"></p>
        <div id="conversation-replies" class="conversation-replies"></div>
        <div id="conversation-advance" class="conversation-advance"></div>
        <button id="conversation-close" type="button">End conversation</button>
      </div>
    </section>
    <section class="panel controls">
      <div class="dpad">
        <button class="up" data-dir="up" aria-label="Move up">▲</button>
        <button class="left" data-dir="left" aria-label="Move left">◀</button>
        <button class="down" data-dir="down" aria-label="Move down">▼</button>
        <button class="right" data-dir="right" aria-label="Move right">▶</button>
      </div>
      <div class="actions">
        <button id="interact">Interact</button>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
